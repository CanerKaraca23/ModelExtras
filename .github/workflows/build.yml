# Based on CanerKaraca20 build script
name: Build ModelExtras

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        actions-cache-folder: .xmake-cache

    - name: Setup latest Clang
      uses: egor-tensin/setup-clang@v1
      with:
        version: latest

    - name: Setup latest llvm-mingw
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        rm -rf llvm-mingw llvm-mingw-* llvm-mingw.tar.xz
        LLVM_MINGW_URL="$(python3 - <<'PY'
import json
import os
import sys
import urllib.error
import urllib.request

api = "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
headers = {"Accept": "application/vnd.github+json"}
token = os.getenv("GITHUB_TOKEN")
if token:
    headers["Authorization"] = f"Bearer {token}"
request = urllib.request.Request(api, headers=headers)

try:
    with urllib.request.urlopen(request, timeout=30) as r:
        release = json.load(r)
except urllib.error.URLError as e:
    sys.stderr.write(f"Failed to query llvm-mingw latest release: {e}\n")
    sys.exit(1)

for asset in release["assets"]:
    if (
        asset["name"].endswith(".tar.xz")
        and "ubuntu" in asset["name"]
        and "x86_64" in asset["name"]
        and "arm64" not in asset["name"]
    ):
        print(asset["browser_download_url"])
        break
else:
    sys.stderr.write("No suitable latest llvm-mingw ubuntu x86_64 artifact found.\n")
    sys.exit(1)
PY
)"
        curl -fsSL "$LLVM_MINGW_URL" -o llvm-mingw.tar.xz
        tar -xf llvm-mingw.tar.xz
        LLVM_MINGW_DIR="$(find . -maxdepth 1 -type d -name 'llvm-mingw-*' -print -quit)"
        if [ -z "$LLVM_MINGW_DIR" ]; then
          echo "Failed to find extracted llvm-mingw directory after unpacking archive." >&2
          exit 1
        fi
        mv "$LLVM_MINGW_DIR" llvm-mingw
        echo "$GITHUB_WORKSPACE/llvm-mingw/bin" >> "$GITHUB_PATH"
        echo "LLVM_MINGW_ROOT=$GITHUB_WORKSPACE/llvm-mingw" >> "$GITHUB_ENV"

    - name: Get latest plugin-sdk commit
      id: plugin-sdk-ref
      run: |
        echo "sha=$(git ls-remote https://github.com/user-grinch/plugin-sdk-mingw.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

    - name: Restore plugin-sdk cache
      id: plugin-sdk-cache
      uses: actions/cache@v5
      with:
        path: plugin-sdk
        key: plugin-sdk-${{ steps.plugin-sdk-ref.outputs.sha }}-i686-w64-mingw32

    - name: Build plugin-sdk
      if: steps.plugin-sdk-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/user-grinch/plugin-sdk-mingw.git plugin-sdk
        cd plugin-sdk
        git checkout "${{ steps.plugin-sdk-ref.outputs.sha }}"
        mkdir -p output/lib
        for dir in shared plugin_sa safetyhook; do
          find "$dir" -type d -exec mkdir -p "obj/{}" \;
        done

        FLAGS="-I. -Ishared -Ishared/game -Iplugin_sa -Iplugin_sa/game_sa -Iplugin_sa/game_sa/rw -Isafetyhook -DGTASA -DPLUGIN_SGV_10US -DRW"
        CLANG_FLAGS="--target=i686-w64-mingw32 -fpermissive -fcommon -fms-extensions -Wno-microsoft-include -Wno-builtin-macro-redefined -Wno-macro-redefined -Wno-comment -Wno-new-returns-null -Wno-deprecated-enum-enum-conversion -Wno-pragma-once-outside-header -Wno-invalid-offsetof -O2 -D__cpp_concepts=202202L"

        find shared plugin_sa safetyhook -name '*.cpp' -print0 | \
          xargs -0 -P$(nproc) -I{} clang++ $CLANG_FLAGS -std=c++2b $FLAGS -c {} -o obj/{}.o

        find safetyhook -name '*.c' -print0 | \
          xargs -0 -P$(nproc) -I{} clang $CLANG_FLAGS $FLAGS -c {} -o obj/{}.o

        find obj -name '*.o' | xargs "$LLVM_MINGW_ROOT/bin/i686-w64-mingw32-ar" rcs output/lib/libplugin.a

        echo "PLUGIN_SDK_DIR=$GITHUB_WORKSPACE/plugin-sdk" >> "$GITHUB_ENV"

    - name: Use cached plugin-sdk
      if: steps.plugin-sdk-cache.outputs.cache-hit == 'true'
      run: echo "PLUGIN_SDK_DIR=$GITHUB_WORKSPACE/plugin-sdk" >> "$GITHUB_ENV"

    - name: Build ModelExtras with xmake
      run: |
        xmake f -m release \
          --mingw="$LLVM_MINGW_ROOT" \
          --cc=clang \
          --cxx=clang++ \
          -c -y
        xmake -j$(nproc)

    - name: Prepare artifact files
      run: |
        mkdir -p artifact/ModelExtras
        cp build/mingw/x86/release/ModelExtras.asi artifact/ModelExtras.asi
        cp resource/dist/ModelExtras.ini artifact/ModelExtras.ini
        cp -r resource/dist/ModelExtras/* artifact/ModelExtras/

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ModelExtras-Test-Build
        path: |
          artifact/ModelExtras.asi
          artifact/ModelExtras.ini
          artifact/ModelExtras/**
