# Based on CanerKaraca23 build script
name: Build ModelExtras

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        actions-cache-folder: .xmake-cache

    - name: Setup Clang
      id: setup-clang
      uses: egor-tensin/setup-clang@v1

    - name: Setup MinGW
      id: setup-mingw
      uses: egor-tensin/setup-mingw@v3

    - name: Resolve MinGW paths
      run: |
        GCC="${{ steps.setup-mingw.outputs.gcc }}"
        PREFIX="${GCC%gcc}"
        echo "MINGW_GCC=${GCC}" >> "$GITHUB_ENV"
        echo "MINGW_GXX=${{ steps.setup-mingw.outputs.gxx }}" >> "$GITHUB_ENV"
        echo "MINGW_ROOT=${GCC%/bin/*}" >> "$GITHUB_ENV"
        echo "MINGW_PREFIX=${PREFIX}" >> "$GITHUB_ENV"
        echo "MINGW_AR=${PREFIX}ar" >> "$GITHUB_ENV"

    - name: Prepare plugin-sdk
      uses: ./.github/actions/prepare-plugin-sdk
      with:
        clang: ${{ steps.setup-clang.outputs.clang }}
        clangxx: ${{ steps.setup-clang.outputs.clangxx }}
        mingw-gcc: ${{ steps.setup-mingw.outputs.gcc }}

    - name: Build ModelExtras with xmake
      run: |
        xmake f -m release \
          --mingw="${MINGW_ROOT}" \
          --cc="${{ steps.setup-clang.outputs.clang }}" \
          --cxx="${{ steps.setup-clang.outputs.clangxx }}" \
          -c -y
        xmake -j$(nproc)

    - name: Prepare artifact files
      run: |
        mkdir -p artifact/ModelExtras
        cp build/mingw/x86/release/ModelExtras.asi artifact/ModelExtras.asi
        cp resource/dist/ModelExtras.ini artifact/ModelExtras.ini
        cp -r resource/dist/ModelExtras/* artifact/ModelExtras/

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ModelExtras-Test-Build
        path: |
          artifact/ModelExtras.asi
          artifact/ModelExtras.ini
          artifact/ModelExtras/**
