# Based on CanerKaraca23 build script
name: Build ModelExtras

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        actions-cache-folder: .xmake-cache

    - name: Set up Clang
      id: setup-clang
      uses: egor-tensin/setup-clang@v2
      with:
        platform: x86
        version: 22

    - name: Set up MinGW
      id: setup-mingw
      uses: egor-tensin/setup-mingw@v3
      with:
        platform: x86
        version: 15.2.0

    - name: Validate Clang toolchain
      run: |
        echo "clang path: ${{ steps.setup-clang.outputs.clang }}"
        echo "clang++ path: ${{ steps.setup-clang.outputs.clangxx }}"
        "${{ steps.setup-clang.outputs.clang }}" --version
        "${{ steps.setup-clang.outputs.clangxx }}" --version

    - name: Validate MinGW toolchain
      run: |
        MINGW_GCC="${{ steps.setup-mingw.outputs.gcc }}"
        MINGW_GXX="${{ steps.setup-mingw.outputs.gxx }}"
        MINGW_PREFIX="${MINGW_GCC%-gcc}"
        echo "mingw gcc: $MINGW_GCC"
        echo "mingw g++: $MINGW_GXX"
        echo "mingw prefix: $MINGW_PREFIX"
        "$MINGW_GCC" --version
        "$MINGW_GXX" --version
        "$MINGW_PREFIX-ar" --version
        "$MINGW_GCC" -dumpmachine

    - name: Get latest plugin-sdk commit
      id: plugin-sdk-ref
      run: |
        echo "sha=$(git ls-remote https://github.com/user-grinch/plugin-sdk-mingw.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

    - name: Restore plugin-sdk cache
      id: plugin-sdk-cache
      uses: actions/cache@v5
      with:
        path: plugin-sdk
        key: plugin-sdk-${{ steps.plugin-sdk-ref.outputs.sha }}-i686-w64-mingw32

    - name: Build plugin-sdk
      if: steps.plugin-sdk-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/user-grinch/plugin-sdk-mingw.git plugin-sdk
        cd plugin-sdk
        git checkout "${{ steps.plugin-sdk-ref.outputs.sha }}"
        mkdir -p output/lib
        for dir in shared plugin_sa safetyhook; do
          find "$dir" -type d -exec mkdir -p "obj/{}" \;
        done

        FLAGS="-I. -Ishared -Ishared/game -Iplugin_sa -Iplugin_sa/game_sa -Iplugin_sa/game_sa/rw -Isafetyhook -DGTASA -DPLUGIN_SGV_10US -DRW"
        CLANG_FLAGS="--target=i686-w64-mingw32 -fpermissive -fcommon -fms-extensions -Wno-microsoft-include -Wno-builtin-macro-redefined -Wno-macro-redefined -Wno-comment -Wno-new-returns-null -Wno-deprecated-enum-enum-conversion -Wno-pragma-once-outside-header -Wno-invalid-offsetof -O2 -D__cpp_concepts=202202L"

        find shared plugin_sa safetyhook -name '*.cpp' -print0 | \
          xargs -0 -P$(nproc) -I{} ${{ steps.setup-clang.outputs.clangxx }} $CLANG_FLAGS -std=c++2b $FLAGS -c {} -o obj/{}.o

        find safetyhook -name '*.c' -print0 | \
          xargs -0 -P$(nproc) -I{} ${{ steps.setup-clang.outputs.clang }} $CLANG_FLAGS $FLAGS -c {} -o obj/{}.o

        MINGW_AR="${{ steps.setup-mingw.outputs.gcc }}"
        MINGW_AR="${MINGW_AR%-gcc}-ar"
        find obj -name '*.o' | xargs "$MINGW_AR" rcs output/lib/libplugin.a

        echo "PLUGIN_SDK_DIR=$GITHUB_WORKSPACE/plugin-sdk" >> "$GITHUB_ENV"

    - name: Use cached plugin-sdk
      if: steps.plugin-sdk-cache.outputs.cache-hit == 'true'
      run: echo "PLUGIN_SDK_DIR=$GITHUB_WORKSPACE/plugin-sdk" >> "$GITHUB_ENV"

    - name: Build ModelExtras with xmake
      run: |
        xmake f -m release \
          --mingw=/usr \
          --cc=${{ steps.setup-clang.outputs.clang }} \
          --cxx=${{ steps.setup-clang.outputs.clangxx }} \
          -c -y
        xmake -j$(nproc)

    - name: Prepare artifact files
      run: |
        mkdir -p artifact/ModelExtras
        cp build/mingw/x86/release/ModelExtras.asi artifact/ModelExtras.asi
        cp resource/dist/ModelExtras.ini artifact/ModelExtras.ini
        cp -r resource/dist/ModelExtras/* artifact/ModelExtras/

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ModelExtras-Test-Build
        path: |
          artifact/ModelExtras.asi
          artifact/ModelExtras.ini
          artifact/ModelExtras/**
